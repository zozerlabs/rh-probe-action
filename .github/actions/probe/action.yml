name: probe
description: Composite exporting an inner step outcome as a declared output
outputs:
  inner-outcome:
    description: Outcome of the deliberately failing inner step
    value: ${{ steps.bravo.outcome }}
runs:
  using: composite
  steps:
    - name: INNER_STEP_BRAVO
      id: bravo
      shell: bash
      continue-on-error: true
      run: exit 1
